[project]
name = "manifest-mcp"
version = "1.0.0"
description = "Manifest MCP server and the `manifest` command-line interface"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Manifest Team"}
]
keywords = ["mcp", "model-context-protocol", "manifest", "startup", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# `manifest voice`: talk to Manifest from the terminal (--text needs only websockets).
voice = [
    "websockets>=13.0",
    "sounddevice>=0.5.0",
]
# `manifest bridge`: natural voice on this Mac with no API key (Pipecat, local Whisper on
# Apple silicon, Kokoro voice); your own agent (Claude Code, Codex) is the brain.
local-voice = [
    "pipecat-ai[kokoro,mlx-whisper,whisper,silero,websocket]==1.16.0",
]
# The natural voice for the bridge: Kokoro on the Apple GPU (speech.py). Apple silicon only.
natural-voice = [
    "mlx-audio>=0.6.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]>=0.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # misaki downloads this at runtime and exits when it can't (uv tool installs): ship it.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
manifest-mcp = "manifest_mcp.server:main"
manifest = "manifest_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manifest_mcp", "src/manifest_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.metadata]
# The natural-voice extra ships spaCy's English model from its GitHub release (not on PyPI).
allow-direct-references = true
