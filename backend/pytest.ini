[pytest]
testpaths = tests
python_files = tests/*.py tests/**/*.py
addopts = --cov=app --cov-report=term-missing --cov-report=html:../docs/backend-coverage/html --cov-report=xml:../docs/backend-coverage/coverage.xml --cov-fail-under=0
markers = 
    slow: marks tests as slow (deselect with '-m "not slow"')
    serial
    memory_only: inspects the in-memory database (skipped on a real Postgres)
filterwarnings =
    ignore::DeprecationWarning 