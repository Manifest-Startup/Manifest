version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: manifest-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: manifest-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    env_file:
      - .env