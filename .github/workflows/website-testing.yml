name: Internal Website Feedback Loop

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public URL to audit
        required: false
        default: https://manifeststartup.com
        type: string
      max_pages:
        description: Maximum number of public pages to crawl
        required: false
        default: "6"
        type: string
      max_issues:
        description: Maximum number of issues to create
        required: false
        default: "6"
        type: string
      dry_run:
        description: Generate candidates without creating GitHub issues
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: internal-website-feedback-loop
  cancel-in-progress: false

jobs:
  audit-production-website:
    name: Audit production site for internal feedback and sync GitHub issues
    runs-on: ubuntu-latest

    env:
      TARGET_URL: ${{ github.event.inputs.target_url || 'https://manifeststartup.com' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '6' }}
      MAX_ISSUES: ${{ github.event.inputs.max_issues || '6' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      MANIFEST_GITHUB_REPO: ${{ github.repository }}
      MANIFEST_GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run internal website feedback loop
        run: |
          PYTHONPATH=backend python backend/scripts/run_website_issue_sync.py \
            --target-url "$TARGET_URL" \
            --max-pages "$MAX_PAGES" \
            --max-issues "$MAX_ISSUES" \
            $(if [ "$DRY_RUN" = "true" ]; then echo "--dry-run"; fi) | tee website-issue-sync.json

      - name: Upload audit summary
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874  # v4.4.0
        with:
          name: internal-website-feedback-loop
          path: website-issue-sync.json
