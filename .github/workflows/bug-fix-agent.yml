name: Bug-Fix Agent (diagnose-only)

# When an issue gets the `automated-test` label (typically posted by
# the Manifest production-test runner), spin up the diagnose-only
# bug-fix agent. The agent reads the issue body, fetches the suspected
# files from the repo checkout, asks an LLM for a structured root-cause
# diagnosis, and posts it as a comment on the issue.
#
# v1 is comment-only (no PR creation, no branch creation). See
# docs/BUG_FIX_AGENT.md for the v2 roadmap.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to diagnose
        required: true
        type: string
      dry_run:
        description: Skip posting the comment / backend record
        required: false
        default: false
        type: boolean
  issues:
    types: [labeled]

concurrency:
  group: bug-fix-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    name: 🔍  Diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.action == 'labeled' && github.event.label.name == 'automated-test')
      }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MANIFEST_INTERNAL_API_URL: ${{ vars.MANIFEST_INTERNAL_API_URL || 'https://manifeststartup.com' }}
      MANIFEST_AGENT_LOOP_SECRET: ${{ secrets.MANIFEST_AGENT_LOOP_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUGFIX_AGENT_MODEL: ${{ vars.BUGFIX_AGENT_MODEL || 'gpt-4o-mini' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install "openai>=1.40,<3" "httpx>=0.27,<1"

      - name: Resolve issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bug-fix agent
        env:
          BUGFIX_AGENT_ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          ARGS="--issue-number ${{ steps.issue.outputs.number }} --repo ${{ github.repository }}"
          if [ "${{ steps.issue.outputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python backend/scripts/run_bugfix_agent.py $ARGS
